spring.application.name=libraryhub

# ---------------------------------------------------------------- Server
server.port=8080
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------------------------------------------------------------- SQLite
# library.db is created in the working directory on first start.
# foreign_keys, WAL journal and a 5 second busy timeout are applied to every connection.
spring.datasource.url=jdbc:sqlite:library.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time, so the pool holds a single connection.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# schema.sql is idempotent (CREATE ... IF NOT EXISTS), so it runs on every start.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------- Web
spring.thymeleaf.encoding=UTF-8
# Static files are always revalidated, so style and script changes show up on refresh.
spring.web.resources.cache.cachecontrol.no-cache=true

logging.level.org.springframework.security=WARN

# ---------------------------------------------------------------- LibraryHub rules
library.loan-days=14
library.fine-per-day=5.00
library.max-active-loans=3
library.block-issue-with-unpaid-fines=true
library.reservation-hold-hours=48
library.timezone=Asia/Kolkata
# Shows the seeded demo accounts on the sign-in page. Set to false for a real deployment.
library.show-demo-credentials=true
library.login.max-failed-attempts=5
library.login.lock-seconds=60
