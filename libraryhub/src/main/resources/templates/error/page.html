<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Error', ~{::main}, 'error')}">
<head><title>Error</title></head>
<body>
<main id="main" class="container error-page" tabindex="-1">
    <p class="error-code num" th:text="${status}">404</p>
    <h1 th:text="${headline}">We couldn't find that page</h1>
    <p class="muted" th:text="${message}">Message</p>
    <div class="hero-actions">
        <a class="btn btn-primary" th:href="@{/}"><span class="btn-label">Back to home</span></a>
    </div>
</main>
</body>
</html>
