<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content, active)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="layout-site" th:attr="data-page=${active}">
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
    <div class="container nav-inner">
        <a class="brand" th:href="@{/}" aria-label="LibraryHub home">
            <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-book"/></svg></span>
            <span class="brand-name">LibraryHub</span>
        </a>

        <nav class="primary-nav" aria-label="Primary">
            <a class="nav-link" th:href="@{/}" th:classappend="${active == 'home'} ? 'is-active'"
               th:attr="aria-current=${active == 'home' ? 'page' : null}">Home</a>
            <a class="nav-link" sec:authorize="hasRole('USER')" th:href="@{/dashboard}"
               th:classappend="${active == 'dashboard'} ? 'is-active'"
               th:attr="aria-current=${active == 'dashboard' ? 'page' : null}">Dashboard</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin panel</a>
        </nav>

        <div class="nav-actions">
            <button type="button" class="btn btn-ghost btn-icon" data-theme-toggle aria-label="Switch to dark theme">
                <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
                <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
            </button>

            <th:block sec:authorize="isAnonymous()">
                <a class="btn btn-ghost" th:href="@{/login}">Sign in</a>
                <a class="btn btn-primary" th:href="@{/register}"><span class="btn-label">Create account</span></a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <span class="user-chip">
                    <span class="avatar" aria-hidden="true" th:text="${currentUser != null ? currentUser.initials() : '?'}">AB</span>
                    <span class="user-name" th:text="${currentUser != null ? currentUser.name() : ''}">Name</span>
                </span>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-secondary">
                        <svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>
                        <span class="btn-label">Sign out</span>
                    </button>
                </form>
            </th:block>
        </div>
    </div>
</header>

<div th:replace="~{fragments/flash :: flash}"></div>

<th:block th:replace="${content}"></th:block>

<footer class="site-footer">
    <div class="container">
        <p>LibraryHub: Digital Library Management System</p>
    </div>
</footer>

<svg th:replace="~{fragments/icons :: sprite}"></svg>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
